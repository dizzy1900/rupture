# rupture job manifest (schema: infra/jobs/schema.json, ADR-0016). Placeholders: <r> region id,
# <from>/<to> UTC instants bounding the pseudo-prospective schedule (ADR-0015).
manifest_version: "0"
name: evaluate-schedule
description: >-
  Rolling pseudo-prospective issue-and-evaluate for one region: every 30 days from <from> to <to>,
  issue the ETAS forecast from data strictly before the issue time and score it with the CSEP
  tests. Aggregates to reports/eval/schedule-<r>.json.
status: run
image: ${RUPTURE_IMAGE}
command:
  - rupture
  - evaluate
  - schedule
  - --region
  - <r>
  - --model
  - etas
  - --from
  - <from>
  - --to
  - <to>
  - --step
  - 30d
inputs:
  - path: data/catalogs/<r>
    remote: ${RUPTURE_DVC_REMOTE_URL}/data/catalogs/<r>
    kind: dvc
  - path: baselines/etas/<r>
    remote: ${RUPTURE_DVC_REMOTE_URL}/baselines/etas/<r>
    kind: dvc
outputs:
  - path: data/forecasts/<r>
    remote: ${RUPTURE_DVC_REMOTE_URL}/data/forecasts/<r>
    kind: dvc
  - path: reports/eval/schedule-<r>.json
    remote: ${RUPTURE_DVC_REMOTE_URL}/reports/eval/schedule-<r>.json
    kind: report
resources:
  cpu: 8
  memory_gib: 32
  timeout_minutes: 720
  core_hours_estimate: 1.0
  core_hours_basis: measured
  core_hours_note: >-
    Measured on an arm64 laptop, single-threaded in practice (93 % of one core). Turkiye, 55 windows
    with 4 yearly refits: 3317.65 s user + 93.29 s system = 0.95 core-hours over a 1:00:44 wall clock
    (reports/protocol/schedule-turkiye-eaf.log). Nepal, 55 windows: 2055.53 + 91.33 s = 0.60
    core-hours (reports/protocol/schedule-nepal-himalaya.log). California is the warning: one window
    alone cost 437.23 + 38.64 s = 0.13 core-hours against a 55,828-event history
    (reports/protocol/schedule-california-probe.log), so cost per window grows with the history and
    the full California schedule is tens of core-hours, not one. Confirm per region before paying.
  gpu: none
schedule: null
env:
  - RUPTURE_DVC_REMOTE_URL
  - AWS_REGION
aws:
  service: batch-ec2
  region: ${AWS_REGION}
  batch:
    job_definition_name: rupture-evaluate-schedule
    vcpus: 8
    memory_mib: 32768
    attempts: 1
    timeout_seconds: 43200
    compute_environment_note: long-running; EC2-backed queue so a 12 h wall clock is allowed
  s3:
    bucket_env: RUPTURE_DVC_REMOTE_URL
    prefix: reports/eval/
  iam_role_name: rupture-batch-job-role
  log_group: /rupture/batch/evaluate-schedule
