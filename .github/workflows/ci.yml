name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: lint · typecheck · offline tests · language gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --locked
      - name: Lint (ruff, import-linter)
        run: make lint
      - name: Typecheck (mypy --strict)
        run: make typecheck
      - name: Offline tests (sockets disabled)
        run: make test
      - name: Language gate
        run: make validate-language
      - name: Contract drift
        run: make schema-check

  hazard-integration:
    name: OpenQuake demo in pinned Docker image
    # Docker is available on ubuntu runners; it is not assumed on developer machines.
    # Runs on manual dispatch and on pushes to main (Phase 2C, ADR-0030). Pull requests keep the
    # offline job only; `make validate-hazard` skips with a printed reason where Docker is absent.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: offline
    env:
      RUPTURE_HAZARD_WORK_DIR: ${{ github.workspace }}/.hazard-work
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Pull the pinned OpenQuake image
        timeout-minutes: 10
        run: docker pull openquake/engine:3.26.2
      - name: validate-hazard (bundled demo through the adapter)
        timeout-minutes: 20
        run: make validate-hazard
      - name: Integration tests (Docker)
        timeout-minutes: 20
        run: uv run pytest tests/integration/hazard -m integration -ra
      - name: Upload work directory (job.ini, exports, oq.log)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hazard-work-${{ github.run_id }}
          path: ${{ github.workspace }}/.hazard-work
          if-no-files-found: warn
          retention-days: 14
