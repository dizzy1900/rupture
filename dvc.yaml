# rupture DVC pipeline. Stages are declared per test region; outputs are DVC-tracked, not git-tracked.
# `dvc repro` needs network access (catalogue fetches). The offline gates never call it.
#
# STATE OF THE REMOTE (2026-09-04), stated plainly because the tracking metadata below looks
# complete and is not backed by anything a fresh clone can reach:
#
#   .dvc/config points `remote "local"` at the relative path `local-remote`. That directory does
#   not exist in this repository and is git-ignored, so it is a name, not a store. Nothing has ever
#   been pushed: `dvc status -c` lists every `data/catalogs/*` and `baselines/etas/*` output as
#   `new`. A fresh clone therefore gets the dvc.lock hashes and no way to obtain the bytes they
#   name; `dvc pull` fails. The only copies of the three published ETAS fits are a working tree and
#   its .dvc/cache. docs/ETAS_BASELINE.md § Published fits is the human-readable mitigation (the
#   parameters, diagnostics and log-likelihoods in a committed document), not a recoverable
#   FitResult.
#
#   Making this real needs storage nobody has provisioned. The steps, in order, when it exists:
#       dvc remote add -d -f store s3://<bucket>/rupture     # or gs://, azure://, ssh://
#       dvc remote modify store <credentials per docs/CREDENTIALS.md>
#       dvc push                                             # then commit .dvc/config
#   Until `dvc push` has run, a release must not claim the artefacts are recoverable.
#
# STATE OF dvc.lock (2026-09-04): stale, and knowingly so. It records the `fit_etas` command
# without `--max-seconds 21600`, and its `src/rupture/adapters/forecasting` dependency hash predates
# the log-likelihood work (ADR-0036), so `dvc status` reports all three fit stages as changed. It
# cannot be refreshed with `dvc commit` here because the outputs are not in this working tree; it
# must be refreshed by whoever next runs `dvc repro fit_etas@<region>` with the catalogues in hand.
# That run will also give the persisted fits the `log_likelihood` field they currently lack.

vars:
  - regions: [california, nepal-himalaya, turkiye-eaf]
  - cutoff: "2022-01-01T00:00:00Z"
  - schedule_end: "2026-08-01T00:00:00Z"

stages:
  build_catalog:
    foreach: ${regions}
    do:
      cmd: uv run rupture catalog build --region ${item} --from 1976-01-01 --to ${schedule_end}
      deps:
        - src/rupture/adapters/catalogs
        - src/rupture/pipelines/build_catalog.py
        - data/regions/${item}
      outs:
        - data/catalogs/${item}

  fit_etas:
    foreach: ${regions}
    do:
      # --max-seconds: California has 55k events above its Mc and needs ~94 min of EM; the
      # 1800 s default would stop it early and persist converged=false (a different artefact).
      cmd: >-
        uv run rupture forecast fit --model etas --region ${item} --cutoff ${cutoff}
        --max-seconds 21600
      deps:
        - src/rupture/adapters/forecasting
        - src/rupture/pipelines/fit_etas.py
        - data/catalogs/${item}
      outs:
        - baselines/etas/${item}

  # NOTE (2026-09-03): this stage has never been run through `dvc repro`; the published schedules
  # in reports/protocol/ were produced by the CLI directly with --reports. The stage also gains
  # archive entries under its own `baselines/etas/<region>/fits/` dep when refits happen, so
  # `dvc repro` will see that dep change after a run; the declared baseline itself is not
  # replaced (refits are archive-only, see save_fit).
  evaluate_schedule:
    foreach: ${regions}
    do:
      cmd: >-
        uv run rupture evaluate schedule --region ${item} --model etas
        --from ${cutoff} --to ${schedule_end} --step 30d --horizon 30d
        --refit yearly --n-simulations 1000 --seed 20220101
      deps:
        - src/rupture/adapters/evaluation
        - src/rupture/pipelines/evaluate.py
        - data/catalogs/${item}
        - baselines/etas/${item}
      outs:
        - data/forecasts/${item}
        - reports/eval/schedule-${item}-etas-mizrahi.json
